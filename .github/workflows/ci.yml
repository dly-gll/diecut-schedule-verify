name: Diecut schedule CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diecut-schedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: diecut-schedule/package-lock.json
      - name: Apply shipping quantity repair
        run: node ../tools/repair-shipping-quantity.js
      - name: Commit verified source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..
          if ! git diff --quiet -- diecut-schedule/server.js; then
            git add diecut-schedule/server.js
            git commit -m "Fix workflow shipping quantity synchronization"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: node ../test-workflow-board.js
      - name: Package verified source
        run: |
          cd ..
          rm -rf /tmp/diecut-schedule-package
          mkdir -p /tmp/diecut-schedule-package
          rsync -a --exclude=node_modules --exclude=data.db --exclude='data.db-*' --exclude=.git diecut-schedule/ /tmp/diecut-schedule-package/
          cd /tmp
          zip -qr diecut-schedule-verified.zip diecut-schedule-package
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: diecut-schedule-verified
          path: /tmp/diecut-schedule-verified.zip
          if-no-files-found: error
