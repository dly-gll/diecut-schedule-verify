name: Diecut schedule CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diecut-schedule
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: diecut-schedule/package-lock.json

      # Apply stable verification patches, then commit their resulting source before tests.
      - name: Apply page-owned import isolation
        run: node ../tools/apply-page-owned-import-isolation.js
      - name: Apply empty-board view fix
        run: node ../tools/apply-empty-board-view-fix.js

      - name: Commit verified source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..
          if ! git diff --quiet -- diecut-schedule/server.js diecut-schedule/public/index.html; then
            git add diecut-schedule/server.js diecut-schedule/public/index.html
            git commit -m "Verify latest-data board view behavior"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: node ../test-workflow-board.js
      - run: node ../test-product-machine-priority.js
      - run: node ../test-import-data-scope.js
      - run: node ../test-empty-board-view.js
      - run: node ../test-ui-features.js

      - name: Package verified source
        run: |
          cd ..
          rm -rf /tmp/diecut-release /tmp/diecut-schedule-verified.zip
          mkdir -p /tmp/diecut-release/diecut-schedule
          rsync -a --exclude=node_modules --exclude=data.db --exclude='data.db-*' --exclude=.git diecut-schedule/ /tmp/diecut-release/diecut-schedule/
          test -f /tmp/diecut-release/diecut-schedule/server.js
          test -f /tmp/diecut-release/diecut-schedule/package.json
          cd /tmp/diecut-release
          zip -qr /tmp/diecut-schedule-verified.zip diecut-schedule
          unzip -l /tmp/diecut-schedule-verified.zip | grep -q 'diecut-schedule/server.js'

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: diecut-schedule-verified
          path: /tmp/diecut-schedule-verified.zip
          if-no-files-found: error
