name: Diecut schedule CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diecut-schedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: diecut-schedule/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: node ../test-workflow-board.js
